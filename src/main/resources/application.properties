# Redis / ElastiCache
# For ElastiCache (cluster mode disabled) set the endpoint (e.g. my-redis.xxxxxx.0001.usw2.cache.amazonaws.com)
# If running locally, set to localhost and the port your Redis server listens on.
redis.host=localhost
redis.port=6379
# If your Redis requires a password, set redis.password=<your-password>
redis.password=

# Optional cluster mode properties (comma-separated host:port nodes)
redis.cluster.enabled=false
redis.cluster.nodes=

# Use TLS when required by your Redis/ElastiCache setup
redis.ssl=false
