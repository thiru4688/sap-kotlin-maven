# --- Redis Configuration ---
# If using local Docker: localhost. If AWS: Use the ElastiCache Primary Endpoint.
# ===============================
# Redis (AWS ElastiCache)
# ===============================
#for local
spring.data.redis.host= localhost
#For aws
#spring.data.redis.host=master.poccache.c2wslz.aps1.cache.amazonaws.com
#poccache-> name of cache
spring.data.redis.port=6379
#for local
spring.data.redis.ssl.enabled=false
#For aws
#spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=5000

# Enable Spring Cache with Redis
spring.cache.type=redis
spring.cache.redis.key-prefix=user_cache::
spring.cache.redis.time-to-live=600000

# ===============================
# AWS Configuration
# ===============================
aws.region=ap-south-1

# DynamoDB
aws.dynamodb.endpoint=https://dynamodb.ap-south-1.amazonaws.com
